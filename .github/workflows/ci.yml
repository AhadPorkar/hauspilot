name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Java 21 / Maven
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test and package backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend - Node 24 / Vitest / Vite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # There is no lockfile in the initial repository. A nonexistent
          # cache-dependency-path stops setup-node before npm can install.
          # Re-enable cache: npm with frontend/package-lock.json ONLY after
          # generating and committing that lockfile.
          package-manager-cache: false
      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo '::warning::package-lock.json is not committed; using npm install. Generate and commit it for reproducible builds.'
            npm install --no-audit --no-fund
          fi
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test
      - name: Type-check and compile frontend
        working-directory: frontend
        run: npm run build
